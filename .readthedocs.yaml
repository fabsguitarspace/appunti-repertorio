version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# La libreria musicale (tools/appunti-musica) serve solo alla build locale
# delle risorse, che sono versionate: Read the Docs non la scarica.
submodules:
  exclude: all

sphinx:
  configuration: src/docs/conf.py

python:
  install:
    - requirements: requirements.txt

# Build PDF & ePub
formats:
  - epub
  - pdf
